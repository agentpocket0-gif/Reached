name: Refresh open-source games research

on:
  schedule:
    # Every Monday 06:00 UTC
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect games (scraper)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/collect_games.py

      - name: Commit updated lists
        run: |
          git config user.name "games-research-bot"
          git config user.email "actions@github.com"
          git add data/*.csv data/*.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "data: auto-refresh open-source games research"
            git push
          fi
